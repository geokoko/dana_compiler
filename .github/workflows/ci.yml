name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-compiler:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Dependencies
      run: |
        # Remove problematic Microsoft repos that may cause apt update failures
        sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
        sudo rm -f /etc/apt/sources.list.d/azure-cli.list
        sudo apt-get update || true
        sudo apt-get install -y build-essential bison flex python3 python3-pip
        # Install LLVM 18
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 18
        # Ensure llvm-config-18 is usable
        sudo apt-get update || true
        sudo apt-get install -y llvm-18 llvm-18-dev libllvm18 clang-18 libclang-rt-18-dev
        # Symlink clang-18 to clang if not exists
        sudo ln -sf /usr/bin/clang-18 /usr/bin/clang
        sudo ln -sf /usr/bin/clang++-18 /usr/bin/clang++
        sudo ln -sf /usr/bin/llc-18 /usr/bin/llc
        rm llvm.sh

    - name: Build Compiler
      run: |
        cd src
        make CXX=clang++-18 CC=clang-18
        chmod +x danac

    - name: Generate Test Matrix
      id: set-matrix
      run: |
        # Generate a JSON array of .dana filenames in tests/programs
        TEST_FILES=$(python3 -c 'import os, glob, json; print(json.dumps([os.path.basename(f) for f in glob.glob("tests/programs/*.dana")]))')
        echo "matrix=$TEST_FILES" >> $GITHUB_OUTPUT
        echo "Found tests: $TEST_FILES"

    - name: Upload Compiler Artifact
      uses: actions/upload-artifact@v4
      with:
        name: compiled-compiler
        path: src/danac
        retention-days: 1

  test-suite:
    needs: build-compiler
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test_file: ${{ fromJson(needs.build-compiler.outputs.matrix) }}
    
    steps:
    - uses: actions/checkout@v4

    - name: Install Runtime Dependencies (LLVM)
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 18
        sudo apt-get install -y llvm-18
        sudo ln -sf /usr/bin/llc-18 /usr/bin/llc
        rm llvm.sh
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python Dependencies
      run: pip install pytest

    - name: Download Compiler Artifact
      uses: actions/download-artifact@v4
      with:
        name: compiled-compiler
        path: src

    - name: Prepare Compiler Executable
      run: |
        chmod +x src/danac
        ls -l src/danac

    - name: Run Test Case
      env:
        CI_PREBUILT_EXECUTABLE: danac
      run: |
        # Run the specific test case corresponding to the file
        pytest -v tests/test_compiler.py -k "${{ matrix.test_file }}"
