name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-20.04
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bison flex python3 python3-pip
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 18
        sudo apt-get install -y llvm-18 llvm-18-dev libllvm18 clang-18 libclang-rt-18-dev
        sudo ln -sf /usr/bin/clang-18 /usr/bin/clang
        sudo ln -sf /usr/bin/clang++-18 /usr/bin/clang++
        rm llvm.sh

    - name: Build Compiler
      run: |
        cd src
        make CXX=clang++-18 CC=clang-18
        strip danac

    - name: Create Release Package
      run: |
        mkdir -p release
        cp src/danac release/
        cp README.md release/
        cp -r docs release/
        cp -r tests/programs release/examples
        tar -czvf danac-${{ github.ref_name }}-linux-x64.tar.gz -C release .
        
    - name: Create Checksum
      run: |
        sha256sum danac-${{ github.ref_name }}-linux-x64.tar.gz > danac-${{ github.ref_name }}-linux-x64.tar.gz.sha256

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          danac-${{ github.ref_name }}-linux-x64.tar.gz
          danac-${{ github.ref_name }}-linux-x64.tar.gz.sha256
        generate_release_notes: true
        draft: false
        prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
